# application-test.properties

# Datasource H2 TEST
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data-test.sql

spring.sql.init.schema-locations=classpath:schema.sql

# Minio
minio.endpoint=${MINIO_ENDPOINT}
minio.root.user=${MINIO_ROOT_USER}
minio.root.password=${MINIO_ROOT_PASSWORD}

bucket.name=${BUCKET_NAME}

# Front
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

auth.mock.enabled=${AUTH_MOCK_ENABLED:true}
auth.mock.user.id=${AUTH_MOCK_USER_ID:44444444-4444-4444-4444-444444444444}

#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.minutes=${JWT_EXPIRATION}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}

spring.flyway.enabled=false