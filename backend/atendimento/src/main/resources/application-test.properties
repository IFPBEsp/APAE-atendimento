# application-test.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.schemas=atendimento
spring.flyway.default-schema=atendimento
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# Minio
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.root.user=${MINIO_ROOT_USER:minio}
minio.root.password=${MINIO_ROOT_PASSWORD:minio123}

bucket.name=${BUCKET_NAME:apae-test}

# Front
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

auth.mock.enabled=${AUTH_MOCK_ENABLED:true}
auth.mock.user.id=${AUTH_MOCK_USER_ID:44444444-4444-4444-4444-444444444444}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration.minutes=${JWT_EXPIRATION:30}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}