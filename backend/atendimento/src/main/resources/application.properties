spring.application.name=atendimento
spring.profiles.active=${SPRING_PROFILES_ACTIVE:test}
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.main.web-application-type=servlet

server.servlet.context-path=/atendimento

#Configuracao Base do Flyway
spring.flyway.enabled=true
spring.flyway.schemas=atendimento
spring.flyway.default-schema=atendimento
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration