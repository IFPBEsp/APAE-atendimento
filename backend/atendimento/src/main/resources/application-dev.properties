spring.config.import=optional:file:../docker/docker-compose.properties,optional:file:../docker/local-secrets.properties
jwt.secret=${JWT_SECRET}
jwt.expiration.minutes=${JWT_EXPIRATION}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
auth.mock.enabled=false
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# MinIO (DEV)
minio.endpoint=${MINIO_ENDPOINT}
minio.root.user=${MINIO_ROOT_USER}
minio.root.password=${MINIO_ROOT_PASSWORD}
bucket.name=${BUCKET_NAME}