#Configuracao de Importacao Inteligente
spring.config.import=optional:file:.env,optional:file:../../.env,optional:file:./backend/docker/local-secrets.properties,optional:file:../docker/local-secrets.properties

# JPA & ORM
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=atendimento
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# B2 - S3
s3.endpoint=${S3_ENDPOINT}
s3.external-endpoint=${S3_EXTERNAL_ENDPOINT}
s3.region=${S3_REGION}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}

bucket.name=${BUCKET_NAME}

# CORS
cors.allowed-origins=${FRONT_END_URL}

jwt.secret=${JWT_SECRET}
jwt.expiration.minutes=${JWT_EXPIRATION}
jwt.cookie.secure=${JWT_COOKIE_SECURE}
auth.mock.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never