name: PR-Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  issue_comment:
    types:
      - created

jobs:
  pr-agent:
    uses: IFPBEsp/APAE-INFRA/.github/workflows/pr-agent-reusable.yml@b62c701f533613da2e51c167e3917891429f909f

    with:
      model: "gemini/gemini-3.6-flash"
      response-language: "pt-BR"
      auto-review: true
      auto-improve: true
      auto-describe: false
      num-code-suggestions: 3
      ignore-globs: '["*.lock", "pnpm-lock.yaml", "package-lock.json"]'

      extra-instructions: >
        Projeto com backend Java 21 e Spring Boot 3.5 em backend/atendimento.
        Frontend Next.js 16 em frontend/atendimento-app.
        Priorizar bugs, validacao de entradas, tratamento de null,
        seguranca, legibilidade e aderencia aos padroes do projeto.

    secrets:
      LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
