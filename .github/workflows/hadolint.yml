name: Dockerfile Lint

on:
  pull_request:
    paths:
      - "backend/atendimento/Dockerfile"
      - "frontend/atendimento-app/Dockerfile"
      - ".github/workflows/hadolint.yml"

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfiles
    uses: IFPBEsp/APAE-INFRA/.github/workflows/hadolint-reusable.yml@f7d59d6e4ad15d8d199aebf619b5b401ffbcc2f12
    with:
      dockerfiles: |
        backend/atendimento/Dockerfile
        frontend/atendimento-app/Dockerfile
      failure-threshold: warning
